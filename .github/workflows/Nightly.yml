name: Nightly Build

# Windows-таргет отложен (день 13, 2026-08-20): образ unityci/editor
# с модулем windows-mono для линии 6000.3.x ещё не опубликован, а сборка
# под временно закреплённой 6000.0.82f1 ломается на InternalBridge-коде
# пакетов com.unity.2d.common и com.unity.2d.tilemap.extras — это не
# единичный баг, а системный разрыв версий. Собираем StandaloneLinux64
# тем же способом, что build.yml/test.yml, уже проверенным на PR.
# Вернуться к Windows, когда появится windows-mono тег под 6000.3.x —
# проверить hub.docker.com/r/unityci/editor/tags?name=windows-mono.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC ~ 05:00 МСК
  workflow_dispatch:

jobs:
  nightly-linux:
    name: Nightly build for Linux
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
          docker-images: false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-StandaloneLinux64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-StandaloneLinux64-

      - name: Compute build version string
        id: version
        run: |
          echo "value=$(date -u +%Y-%m-%d)-run${{ github.run_number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildsPath: build

      - name: Package build with version in the name
        run: |
          cd build/StandaloneLinux64
          zip -r "../../EchoOfSouls-nightly-${{ steps.version.outputs.value }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoOfSouls-nightly-${{ steps.version.outputs.value }}
          path: EchoOfSouls-nightly-${{ steps.version.outputs.value }}.zip
          retention-days: 14